name: lead_kenh_ecom

on:
  schedule:
    # 20:30 UTC = 03:30 giờ VN (lệch 30 phút với workflow Chat Stats để tránh gọi Pancake cùng lúc)
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      date_from:
        description: 'Chạy bù TỪ ngày (dd/mm/yyyy). Để trống = chỉ chạy hôm qua'
        required: false
        default: ''
      date_to:
        description: 'ĐẾN ngày (dd/mm/yyyy). Để trống = đến hôm qua'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tạo file cấu hình từ Secret
        env:
          PAGES_CSV_B64: ${{ secrets.PAGES_CONFIG_CSV_B64 }}
        run: |
          if [ -z "$PAGES_CSV_B64" ]; then
            echo "Thiếu secret PAGES_CONFIG_CSV_B64"
            exit 1
          fi
          echo "$PAGES_CSV_B64" | base64 -d > pages_config_full.csv
          echo "Đã tạo pages_config_full.csv: $(wc -l < pages_config_full.csv) dòng"

      - name: Run sync script
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_APP_TOKEN: ${{ secrets.LARK_BASE_APP_TOKEN }}
          RUN_DATE_FROM: ${{ github.event.inputs.date_from }}
          RUN_DATE_TO: ${{ github.event.inputs.date_to }}
        run: python lead_kenh_ecom.py
