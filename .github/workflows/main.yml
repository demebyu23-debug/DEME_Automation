name: Daily Pancake Chat Stats Sync

on:
  schedule:
    # 20:00 UTC = 03:00 giờ VN (UTC+7) hôm sau
    - cron: '0 20 * * *'
  workflow_dispatch: {}   # cho phép bấm chạy tay để test từ tab Actions trên GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync script 1 (Pancake to Lark gốc)
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: python pancake_to_lark.py

      - name: Run sync script 2 (Đổ dữ liệu Lead mới)
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: python Extract_Lead_Ecom.py
