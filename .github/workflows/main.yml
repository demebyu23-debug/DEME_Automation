name: Push VAT Ke Toan

on:
  workflow_dispatch: {}            # bấm nút chạy tay để test

concurrency:
  group: push-vat-ke-toan
  cancel-in-progress: false        # lần trước chưa xong thì lần sau chờ, không chạy chồng

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Push_Vat_Ke_Toan
        env:
          PANCAKE_API_KEY: ${{ secrets.PANCAKE_API_KEY }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          TZ: Asia/Ho_Chi_Minh
        run: python Push_Vat_Ke_Toan.py
