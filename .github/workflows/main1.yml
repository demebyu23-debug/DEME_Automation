name: Daily Pancake Lead Ecom

on:
  schedule:
    # 20:00 UTC = 03:00 giờ VN (UTC+7) hôm sau
    - cron: '0 20 * * *'
  workflow_dispatch: {}   # cho phép bấm chạy tay để test từ tab Actions trên GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Tạo file cấu hình từ Secret
        env:
          PAGES_CSV_B64: ${{ secrets.PAGES_CONFIG_CSV_B64 }}
        run: |
          if [ -z "$PAGES_CSV_B64" ]; then
            echo "Thiếu secret PAGES_CONFIG_CSV_B64"
            exit 1
          fi
          echo "$PAGES_CSV_B64" | base64 -d > pages_config_full.csv
          echo "Đã tạo pages_config_full.csv: $(wc -l < pages_config_full.csv) dòng"

      - name: Run sync script
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: python Extract_Lead_Ecom.py
