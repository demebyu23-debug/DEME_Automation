name: Sync Lead nhan vien to Lark

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = chỉ in log, không ghi vào Lark"
        required: false
        default: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync script
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python sync_lead_nhan_vien_to_lark.py
