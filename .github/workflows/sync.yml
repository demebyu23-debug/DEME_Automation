name: Auto Sync Pancake to Lark

on:
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công bất cứ lúc nào

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy Code Từ Repository
        uses: actions/checkout@v5

      - name: Cài đặt Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy Script Đồng Bộ
        env:
          # Ép biến môi trường lấy từ GitHub Secrets
          PANCAKE_API_KEY: ${{ secrets.PANCAKE_API_KEY }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: python sync_pancake_orders.py
