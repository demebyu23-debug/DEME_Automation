name: theo_doi_hieu_suat_sale_realtime

on:
  workflow_dispatch: {}          # bấm nút chạy thủ công để test
  # schedule:
  #   - cron: "*/10 * * * *"     # bỏ # ở 2 dòng này để tự chạy mỗi 10 phút

concurrency:
  group: follow-lead-realtime
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tạo file cấu hình từ Secret
        env:
          PAGES_CSV_B64: ${{ secrets.PAGES_CONFIG_CSV_B64 }}
        run: |
          if [ -z "$PAGES_CSV_B64" ]; then
            echo "Thiếu secret PAGES_CONFIG_CSV_B64"
            exit 1
          fi
          echo "$PAGES_CSV_B64" | base64 -d > pages_config_full.csv
          echo "Đã tạo pages_config_full.csv: $(wc -l < pages_config_full.csv) dòng"

      - name: Run realtime script
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_APP_TOKEN: ${{ secrets.LARK_BASE_APP_TOKEN }}
          PERSONAL_ZALO_PAGE_IDS: ${{ secrets.PERSONAL_ZALO_PAGE_IDS }}
          TZ: Asia/Ho_Chi_Minh
        run: python theo_doi_hieu_suat_sale_realtime.py
