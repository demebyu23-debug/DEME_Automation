name: Realtime Follow Lead (10 mins)

on:
  workflow_dispatch: {}          # bấm nút chạy thủ công để test

concurrency:
  group: follow-lead-realtime
  cancel-in-progress: false      # lần trước chưa chạy xong thì lần sau chờ, không chạy chồng

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tạo file cấu hình kênh từ Secret
        env:
          PAGES_CONFIG_CSV: ${{ secrets.PAGES_CONFIG_CSV }}
        run: printf '%s\n' "$PAGES_CONFIG_CSV" > pages_config_full.csv

      - name: Run realtime script
        env:
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          TZ: Asia/Ho_Chi_Minh
        run: python Follow_lead_realtime.py
